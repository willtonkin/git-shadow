name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version && shellcheck bin/git-shadow install.sh test/run.sh .github/scripts/*.sh

  test:
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest  # a modern bash
            path: ""
          - os: macos-latest   # /bin/bash is bash 3.2; put it ahead of any Homebrew bash
            path: /bin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite
        run: |
          if [ -n "${{ matrix.path }}" ]; then export PATH="${{ matrix.path }}:$PATH"; fi
          bash --version | head -n 1
          git --version
          test/run.sh

  # Releases whatever version CHANGELOG.md's newest heading names, once, after
  # the tests pass on main. A release pull request (release-pr.yml) adds the heading.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release the CHANGELOG's newest version if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh
