name: Release PR

# Opens a pull request that moves CHANGELOG.md's [Unreleased] entries under the
# next version. Merging it releases that version (the release job in ci.yml).
#   gh workflow run release-pr.yml -f bump=minor

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [minor, patch, major]
        default: minor

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(.github/scripts/prepare-release.sh "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$version"
          git commit -qam "Release v$version"
          git push -u origin "release/v$version"
          gh pr create --base main --title "Release v$version" --body "Moves the CHANGELOG's unreleased entries under v$version. Merging this tags v$version and publishes a GitHub Release once the tests pass on main.

          Pull requests opened by a workflow don't run CI, so this one has no checks; the release job runs the tests first."
